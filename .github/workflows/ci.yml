name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: compile + unit tests ──────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cortexcrm_test
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run backend unit + integration tests
        working-directory: cortex-backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cortexcrm_test
          SPRING_DATASOURCE_USERNAME: cortex
          SPRING_DATASOURCE_PASSWORD: cortex
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: mvn -B test

      - name: Upload Surefire reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: cortex-backend/target/surefire-reports/
          retention-days: 14

      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Backend Unit Tests
          path: cortex-backend/target/surefire-reports/TEST-*.xml
          reporter: java-junit

  # ── Frontend: type-check + lint ────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint + Types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cortex-frontend/pnpm-lock.yaml

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install deps
        working-directory: cortex-frontend
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: cortex-frontend
        run: pnpm exec tsc -b --noEmit

      - name: Lint
        working-directory: cortex-frontend
        run: pnpm exec eslint . --max-warnings 0

  # ── E2E Tests (sharded) ────────────────────────────────────────────────────
  e2e:
    name: E2E (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-test, frontend-lint]
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cortexcrm
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cortex-frontend/pnpm-lock.yaml

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install frontend deps
        working-directory: cortex-frontend
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('cortex-frontend/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: cortex-frontend
        run: pnpm exec playwright install --with-deps chromium

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Start backend
        working-directory: cortex-backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cortexcrm
          SPRING_DATASOURCE_USERNAME: cortex
          SPRING_DATASOURCE_PASSWORD: cortex
          JWT_SECRET: ci-test-secret-32-chars-minimum!!
          APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: |
          mvn -B -q spring-boot:run &
          for i in {1..30}; do
            curl -sf http://localhost:8080/api/auth/login \
              -H "Content-Type: application/json" \
              -d '{"email":"x","password":"x"}' && break || sleep 3
          done

      - name: Run E2E tests (shard ${{ matrix.shard }}/4)
        working-directory: cortex-frontend
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:8080
        run: |
          pnpm dev &
          sleep 5
          pnpm exec playwright test \
            --shard=${{ matrix.shard }}/4 \
            --grep-invert "@flaky|@visual"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.shard }}
          path: cortex-frontend/test-results/
          retention-days: 14

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: cortex-frontend/blob-report/
          retention-days: 5

  # ── Merge sharded Playwright reports ──────────────────────────────────────
  e2e-report:
    name: Merge E2E Report
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: [e2e]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm + playwright
        run: |
          npm install -g pnpm
          cd cortex-frontend && pnpm install --frozen-lockfile

      - name: Download all blob reports
        uses: actions/download-artifact@v7
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge reports into HTML
        working-directory: cortex-frontend
        run: pnpm exec playwright merge-reports --reporter=html ../all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: cortex-frontend/playwright-report/
          retention-days: 14
