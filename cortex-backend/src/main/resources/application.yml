spring:
  application:
    name: cortex-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cortexcrm}
    username: ${DB_USER:cortex}
    password: ${DB_PASSWORD:cortex}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
    issuer: cortexcrm
    header: Authorization
    prefix: "Bearer "

  cors:
    allowed-origins: http://localhost:5173

claude:
  api:
    key: ${CLAUDE_API_KEY:}
    model: claude-haiku-4-5-20251001
    base-url: https://api.anthropic.com

logging:
  level:
    root: INFO
    com.cortexcrm: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
